<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cbb2"/>
      <stop offset=".44" stop-color="#c76147"/>
      <stop offset="1" stop-color="#421b1b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".13" stop-color="#5f6b70"/>
      <stop offset=".28" stop-color="#fffaf0"/>
      <stop offset=".44" stop-color="#69231f"/>
      <stop offset=".61" stop-color="#dfd6c3"/>
      <stop offset=".79" stop-color="#3d5158"/>
      <stop offset="1" stop-color="#f3d6bd"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-18" dy="28" stdDeviation="24" flood-color="#230809" flood-opacity=".6"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="504" height="1000" fill="url(#bg)"/>
  <ellipse cx="110" cy="175" rx="170" ry="190" fill="#ffddb7" opacity=".42" filter="url(#blur)"/>
  <ellipse cx="425" cy="780" rx="170" ry="190" fill="#456a72" opacity=".3" filter="url(#blur)"/>
  <circle cx="262" cy="425" r="220" fill="none" stroke="#ffe7ce" stroke-width="1" opacity=".3"/>
  <circle cx="262" cy="425" r="281" fill="none" stroke="#ffe7ce" stroke-width=".6" opacity=".16"/>
  <g filter="url(#shadow)">
    <path d="M88 725c18-177 104-365 253-433 78-36 139 18 122 82-18 71-124 99-174 158-56 66-33 162-83 226-44 56-120 38-118-33Z" fill="url(#chrome)"/>
    <ellipse cx="247" cy="377" rx="83" ry="44" fill="#fff8eb" opacity=".3" transform="rotate(-32 247 377)"/>
    <ellipse cx="342" cy="620" rx="70" ry="36" fill="#2b0d0f" opacity=".26" transform="rotate(21 342 620)"/>
  </g>
  <path d="M42 821c133-49 241-42 420 22" fill="none" stroke="#fff2dd" stroke-width="1.2" opacity=".45"/>
